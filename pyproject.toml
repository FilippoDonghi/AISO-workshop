[project]
name = "aiso-agent-workshop-case-study"
version = "0.2.0"
description = "An attributed ML6 workshop case study for a bounded multimodal agent."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "beautifulsoup4>=4.14.3",
    "colorama>=0.4.6,<1",
    "ddgs>=9.10.0,<10",
    "google-adk>=1.28.1,<2",
    "google-genai>=1.46.0,<2",
    "pydantic>=2.12.3,<3",
    "pyfiglet>=1.0.4,<2",
    "pymupdf>=1.27.1,<2",
    "python-dotenv>=1.2.2,<2",
    "requests>=2.33.0,<3",
]

[dependency-groups]
dev = [
    "pytest>=8.4,<10",
    "ruff>=0.13,<1",
]

[tool.pytest.ini_options]
addopts = "-q"
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B", "SIM", "UP"]
